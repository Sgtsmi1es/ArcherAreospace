// ============================================================================
// Archer Aerospace Tech Tree — Tier 8 Part Assignments
// ============================================================================
// T8 is the International Space Station era — the capstone shared by both
// the NASA and Soviet lines. 2.5m modular stations, international cooperation.
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_8_Station_ISS — International Space Station (Shared Capstone)
// ============================================================================
// The culmination of both space programs — 2.5m modular station.
// Shared by NASA Shuttle and Soviet Salyut-Mir progressions.
// ============================================================================

// --- 2.5m Station Cores ---
// PPD-8 'Wharf' Station Core
@PART[sspx-core-25-1]:NEEDS[StationPartsExpansionRedux]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_8_Station_ISS
}

