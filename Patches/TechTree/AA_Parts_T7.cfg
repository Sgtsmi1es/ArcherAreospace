// ============================================================================
// Archer Aerospace Tech Tree — Tier 7 Part Assignments
// ============================================================================
// T7 is the shuttle and long-duration station era:
// - Heavy Lift Jets: Massive turbofan engines
// - Shuttle (NASA): Space Shuttle, reusable orbiters, large cargo
// - Specialized Rocketry: Advanced landers
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_7_Aircraft_Long_Range — Heavy Lift Jets
// ============================================================================
// Massive turbofan engines for cargo aircraft and heavy spaceplanes.
// ============================================================================

// --- Engines ---
// J-90 "Goliath" Turbofan Engine — largest jet engine
