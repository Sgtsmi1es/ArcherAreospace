// ============================================================================
// Archer Aerospace Tech Tree — Parking Node (Catch-All)
// ============================================================================
// This patch runs AFTER all tier-specific patches and assigns any remaining
// parts to the temporary parking node. This prevents soft-locks during
// incremental tree development.
//
// As you build out the tree, parts will be claimed by their proper tier
// patches (which run with :FOR[ArcherAerospace]) before this catch-all
// (which runs with :AFTER[ArcherAerospace]).
// ============================================================================

// Assign ALL parts to parking. The :AFTER ensures this runs last.
// Parts that were already assigned by :FOR[ArcherAerospace] patches
// will get reassigned here, so we need a different approach...

// Actually, MM processes patches in order, and later patches override earlier.
// So we need the T0 patch to run AFTER this one. Let's flip the logic:
// - This runs :FOR[ArcherAerospace] (first)
// - Tier patches run :AFTER[ArcherAerospace] (override parking)

// Assign everything to parking first
@PART[*]:FOR[ArcherAerospace]
{
	@TechRequired = AA_T99_Parking
}
