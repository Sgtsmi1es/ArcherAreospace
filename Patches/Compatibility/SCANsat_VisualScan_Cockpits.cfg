// SCANsat Visual LOW (free) for selected command parts
// Visual Low only | daylight required | max 10km | 0.5° FOV

@PART[Mark2Cockpit,mk2Cockpit_Inline,MEMLander,mk2LanderCabin_v2,sspx-cupola-125-1,seatExternalCmd]:NEEDS[SCANsat]:AFTER[SCANsat]
{
	%MODULE[SCANsat]
	{
	  %name = SCANsat
	  %sensorType = 80        // Visual High + Anomaly
	  %scanName = Visual
	  %requireLight = True

	  %min_alt  = 0
	  %best_alt = 5000
	  %max_alt  = 10000

	  %fov = 0.5
	}
}
