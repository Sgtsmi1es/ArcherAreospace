AGENT
{
    name = Archer Aerospace
    title = Archer Aerospace
    description = Archer Aerospace focuses on flight test, survey aviation, deep-space probes, comms infrastructure, and planetary mapping.

    // Logo paths (no file extension)
    logoURL = ArcherAerospace/Flags/Archer_Aerospace
    logoScaledURL = ArcherAerospace/Flags/Archer_Aerospace

    manufacturer = True

    // Mindset weighting (higher numbers = stronger bias)
    mentality = Scientific 0.9      // science probes & SCANsat contracts
    mentality = Pioneer 0.8         // exploration/orbital survey & first-to objectives
    mentality = Commercial 0.6      // launches, payload delivery, tourism/survey flights
    mentality = Industrial 0.5      // networks, infrastructure, resource/scanning tie-ins
    mentality = Maverick 0.3        // experimental flight test / aircraft-style missions
    mentality = EasyGoing 0.2       // a touch more forgiving on failures

    // Tip: If you *don’t* want Archer to offer stock random contracts, add:
    // mentality = NoRandomContractMentality
}