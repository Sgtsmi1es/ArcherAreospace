// -------------------------------------
// 3-satellite constellation (120° apart)
// -------------------------------------

CONTRACT_TYPE
{
    name = Bodkin_ArcherSat_Constellation3_I0
    title = Archer Aerospace: 3-Satellite Constellation Delivery (0°)
    description = Archer Aerospace will deliver three ArcherSat payloads into a single 300 km equatorial Kerbin orbit (0° inclination), evenly spaced 120° apart, after a 42-day lead time.
    synopsis = Contract Archer Aerospace to build and deploy a 3-satellite constellation. After delivery, the satellites will be transferred to your program.
    completedMessage = Deployment complete. Your 3-satellite constellation has been delivered to orbit and transferred to your control.

    agent = Archer Areospace
    prestige = Trivial

    minExpiry = 1.0
    maxExpiry = 7.0
    deadline = 365.0
    maxSimultaneous = 1

    advanceFunds = -5100
    rewardFunds  = -46200
    rewardScience = 0
    rewardReputation = 0
    failureFunds = 0
    failureReputation = 0

    DATA
    {
        type = int
        flightNum = Random(1, 9999)
        uniqueValue = true
        activeUniqueValue = true
    }

    DATA
    {
        type = double
        mna0 = Random() * 6.283185307179586
        uniqueValue = true
        activeUniqueValue = true
    }
    DATA { type = double mna1 = @/mna0 + 2.0943951023931953 }  // +120°
    DATA { type = double mna2 = @/mna0 + 4.1887902047863905 }  // +240°

    PARAMETER
    {
        name = LeadTime
        type = Duration
        duration = 42d
        startCriteria = CONTRACT_ACCEPTANCE
    }

    BEHAVIOUR
    {
        name = SpawnConstellation
        type = SpawnVessel

        VESSEL
        {
            name = AS-A-K - @/flightNum (I0 1/3)
            craftURL = Archer Areospace/Contracts/VesselTemplates/AS-Test-K.craft
            vesselType = Probe
            owned = false
            targetBody = Kerbin
            ORBIT { SMA = 900000 ECC = 0 INC = 0 LAN = 0 LPE = 0 MNA = @/mna0 EPH = 0 REF = 1 }
        }
        VESSEL
        {
            name = AS-A-K - @/flightNum (I0 2/3)
            craftURL = Archer Areospace/Contracts/VesselTemplates/AS-Test-K.craft
            vesselType = Probe
            owned = false
            targetBody = Kerbin
            ORBIT { SMA = 900000 ECC = 0 INC = 0 LAN = 0 LPE = 0 MNA = @/mna1 EPH = 0 REF = 1 }
        }
        VESSEL
        {
            name = AS-A-K - @/flightNum (I0 3/3)
            craftURL = Archer Areospace/Contracts/VesselTemplates/AS-Test-K.craft
            vesselType = Probe
            owned = false
            targetBody = Kerbin
            ORBIT { SMA = 900000 ECC = 0 INC = 0 LAN = 0 LPE = 0 MNA = @/mna2 EPH = 0 REF = 1 }
        }
    }

    BEHAVIOUR { name = TakeOwnership1 type = ChangeVesselOwnership onState = CONTRACT_COMPLETED vessel = AS-A-K - @/flightNum (I0 1/3) ownership = Owned }
    BEHAVIOUR { name = TakeOwnership2 type = ChangeVesselOwnership onState = CONTRACT_COMPLETED vessel = AS-A-K - @/flightNum (I0 2/3) ownership = Owned }
    BEHAVIOUR { name = TakeOwnership3 type = ChangeVesselOwnership onState = CONTRACT_COMPLETED vessel = AS-A-K - @/flightNum (I0 3/3) ownership = Owned }
}

