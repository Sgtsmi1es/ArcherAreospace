// ============================================================================
// Archer Aerospace Tech Tree — Tier 4 Part Assignments
// ============================================================================
// T4 marks the beginning of serious crewed spaceflight:
// - Supersonic Jets: Afterburning engines
// - Mercury (NASA): First American crewed program, 2.5m introduction
// - Voskhod (Soviet T4.5): Multi-crew upgrade to Vostok
// - Docking (Archer): Core docking technology for all programs
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_4_Aircraft_Sound_Barrier — Supersonic Jets
// ============================================================================
// Afterburning turbofan engines break the sound barrier.
// ============================================================================

// --- Engines ---
// J-404 "Panther" Afterburning Turbofan — variable geometry, afterburner
@PART[turboJet]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_4_Aircraft_Sound_Barrier
}

// --- Landing Gear ---
// LY-35 Medium Landing Gear — larger retractable gear
@PART[GearMedium]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_4_Aircraft_Sound_Barrier
}

// --- Structural ---
// Structural Pylon — engine pylon for larger engines
@PART[structuralPylon]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_4_Aircraft_Sound_Barrier
}

// Tail Connector B — raised tail for ground clearance
@PART[airplaneTailB]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_4_Aircraft_Sound_Barrier
}

