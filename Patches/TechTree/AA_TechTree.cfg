// Replaces the stock tech tree with a custom progression:
// Aircraft -> Early Rocketry/Probes -> Crewed Spaceflight -> Stations -> Speculative
// ============================================================================

// ============================================================================
// STEP 1: Hide all stock tech nodes by making them expensive and empty-hidden
// ============================================================================
@TechTree:FOR[ArcherAerospace]
{
	@RDNode,*
	{
		@cost = 99999
		@hideEmpty = True
	}
}

