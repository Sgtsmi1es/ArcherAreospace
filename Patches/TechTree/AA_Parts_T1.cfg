{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// --- Fuselage & Fuel ---
// Mk1 Liquid Fuel Fuselage — larger fuel tank for jets
@PART[MK1Fuselage]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// --- Utility ---
// Navigation Light Mk1 — for night operations
@PART[navLight1]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

