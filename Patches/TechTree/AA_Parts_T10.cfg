// ============================================================================
// Archer Aerospace Tech Tree — Tier 10 Part Assignments
// ============================================================================
// T10 is endgame propulsion:
// - Advanced SSTO (Aircraft): RAPIER
// - Nuclear Propulsion (Rocket): LV-N family
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_10_Aircraft_AdvancedSSTO — Advanced SSTO
// ============================================================================

// CR-7 R.A.P.I.E.R. Engine
@PART[RAPIER]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_10_Aircraft_AdvancedSSTO
}

// ============================================================================
// AA_10_Rocket_NuclearPropulsion — Nuclear Propulsion
// ============================================================================

// LV-N "Nerv" Atomic Rocket Motor
@PART[nuclearEngine]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_10_Rocket_NuclearPropulsion
}

// LV-N410 "Cherenkov" Atomic Rocket Motor (ReStock+)
@PART[restock-engine-cherenkov]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_10_Rocket_NuclearPropulsion
}

