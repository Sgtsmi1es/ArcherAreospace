// ============================================================================
// Archer Aerospace Tech Tree — Tier 6 Part Assignments
// ============================================================================
// T6 is the lunar era:
// - Hypersonic Flight: Turbo ramjets and thermal management
// - Apollo (NASA): Moon missions, 3.75m and 5m parts, Saturn V scale
// - Salyut (Soviet T6.5): First space stations
// - Archer Heavy: 3.75m parts for general use
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_6_Aircraft_Supersonic_Flight — Hypersonic Flight
// ============================================================================
// Advanced turbo ramjet technology for hypersonic speeds.
// ============================================================================

// --- Engines ---
// J-X4 "Whiplash" Turbo Ramjet Engine — hypersonic capable
@PART[turboFanEngine]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_6_Aircraft_Supersonic_Flight
}

