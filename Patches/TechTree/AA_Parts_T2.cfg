// ============================================================================
// Archer Aerospace Tech Tree — Tier 2 Part Assignments
// ============================================================================
// T2 expands on T1 foundations with more specialized components:
// - Aircraft Design: Advanced wing shapes and control surfaces
// - Structural Engineering: Improved construction components
// - Electronics Systems: Enhanced electrical and comms
// - Applied Science: Field instruments and experiment storage
// - Radar Technology: Altimetry and terrain mapping
// - Rover Systems: Surface exploration vehicles
// - Sounding Rockets: First solid fuel boosters
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_2_Aircraft_Swept_Wings — Aircraft Design
// ============================================================================
// Advanced aerodynamic components for higher performance aircraft.
// ============================================================================

// --- Wings ---
// Wing Connector Type A — basic wing shape
@PART[wingConnector]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_2_Aircraft_Swept_Wings
}

// Wing Connector Type C — another wing variant
@PART[wingConnector3]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_2_Aircraft_Swept_Wings
}

// Wing Connector Type D — wing from the trash bin
@PART[wingConnector4]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_2_Aircraft_Swept_Wings
}

// Structural Wing Type A — for canards and delta leading edges
@PART[structuralWing]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_2_Aircraft_Swept_Wings
}

// Structural Wing Type B — surplus wing components
@PART[structuralWing2]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_2_Aircraft_Swept_Wings
}

// Small Delta Wing — compact delta configuration
