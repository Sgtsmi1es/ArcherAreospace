// GameData/Archer Areospace/Contracts/Bodkin_LaunchService.cfg

// -------------------------
// Single-satellite launches
// -------------------------

CONTRACT_TYPE
{
    name = Bodkin_ArcherSat_LaunchService_I0
    title = Archer Aerospace: Orbital Delivery (0°)
    description = Archer Aerospace will deliver an ArcherSat payload to a 300 km equatorial Kerbin orbit (0° inclination) after a 14-day lead time.
    synopsis = Contract Archer Aerospace to build and launch an ArcherSat payload. After delivery, the satellite will be transferred to your program.
    completedMessage = Launch complete. Your satellite has been delivered to orbit and transferred to your control.

    agent = Archer Areospace
    prestige = Trivial

    minExpiry = 1.0
    maxExpiry = 7.0
    deadline = 365.0
    maxSimultaneous = 1

    advanceFunds = -1700
    rewardFunds  = -15400
    rewardScience = 0
    rewardReputation = 0
    failureFunds = 0
    failureReputation = 0

    DATA
    {
        type = int
        flightNum = Random(1, 9999)
        // If you want to modernize later: replace uniqueValue/activeUniqueValue with uniquenessCheck.
        uniqueValue = true
        activeUniqueValue = true
    }

    DATA
    {
        type = double
        mna = Random() * 6.283185307179586
        uniqueValue = true
        activeUniqueValue = true
    }

    PARAMETER
    {
        name = LeadTime
        type = Duration
        duration = 14d
        startCriteria = CONTRACT_ACCEPTANCE
    }

    BEHAVIOUR
    {
        name = SpawnPayload
        type = SpawnVessel

        VESSEL
        {
            name = AS-A-K - @/flightNum (I0)
            craftURL = Archer Areospace/Contracts/VesselTemplates/AS-Test-K.craft
            vesselType = Probe
            owned = false
            targetBody = Kerbin

            ORBIT
            {
                SMA = 900000
                ECC = 0
                INC = 0
                LAN = 0
                LPE = 0
                MNA = @/mna
                EPH = 0
                REF = 1
            }
        }
    }

    BEHAVIOUR
    {
        name = TakeOwnership
        type = ChangeVesselOwnership
        onState = CONTRACT_COMPLETED
        vessel = AS-A-K - @/flightNum (I0)
        ownership = Owned
    }
}

