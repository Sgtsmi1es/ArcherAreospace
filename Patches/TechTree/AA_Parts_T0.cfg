// ============================================================================
// Archer Aerospace Tech Tree — Tier 0 Part Assignments
// ============================================================================
// AA_0_Aircraft_First_Flight — First Flight
// The minimum parts needed to build a basic flyable jet aircraft.
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// --- Command ---
// Mk2 Cockpit — the pilot's seat
@PART[Mark2Cockpit]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// Personal Parachute
@PART[evaChute]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// --- Propulsion ---
// Juno jet engine (0.625m) — basic jet propulsion
@PART[miniJetEngine]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// Small air intake (0.625m) — feeds the Juno
@PART[miniIntake]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// --- Fuel ---
// Small fuselage (0.625m fuel tank)
@PART[miniFuselage]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// Mk1-Mk2 Adapter (nose cone adapter with optional fuel)
@PART[noseConeAdapter]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// --- Fuselage ---
// Mk1 Structural Fuselage — the backbone
@PART[Mk1FuselageStructural]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// Mk1 Nose Cone — pointy end for aerodynamics
@PART[standardNoseCone]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// --- Wings ---
// Wing Connector Type E — main lifting surface
@PART[wingConnector5]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// Structural Wing Type D — additional wing area
@PART[structuralWing4]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// --- Control Surfaces ---
// Standard Control Surface — ailerons/elevators
@PART[StandardCtrlSrf]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// AV-T1 Winglet — vertical stabilizer with rudder
@PART[winglet3]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// --- Landing Gear ---
// Small Gear Bay — steerable nose wheel
@PART[GearFree]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

// Fixed Landing Gear — main gear
@PART[GearFixed]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_0_Aircraft_First_Flight
}

