// ============================================================================
// Archer Aerospace Tech Tree — Tier 1 Part Assignments
// ============================================================================
// T1 is the first expansion from First Flight, branching into four areas:
// - Aircraft Expansion: More wings, gear, cockpits, cargo
// - Industrial/Structural: Basic construction parts
// - Basic Electronics: Batteries, power generation, comms
// - Basic Science: First scientific instruments
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_1_Aircraft_Expand_Team — Aircraft Expansion
// ============================================================================
// Expands T0 aircraft capabilities with more wing options, retractable gear,
// additional cockpits, and a small cargo bay.
// ============================================================================

// --- Wings ---
// Wing Connector Type B — additional wing shape
@PART[wingConnector2]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// Structural Wing Type C — another wing variant
@PART[structuralWing3]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// Swept Wings — prototype swept back wing
@PART[sweptWing]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// --- Control Surfaces ---
// Tail Fin — blunted tail fin
@PART[tailfin]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// Tail Connector A — simple aerodynamic tail
@PART[airplaneTail]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// --- Landing Gear ---
// LY-10 Small Landing Gear — retractable gear with shock absorber
@PART[SmallGearBay]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_1_Aircraft_Expand_Team
}

// --- Command ---
// Mk1 Cockpit — enclosed cockpit for 1.25m aircraft
