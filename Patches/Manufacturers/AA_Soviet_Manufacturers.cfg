{
	@manufacturer = Kerolev OKB
}

// KV-3 'Pomegranate' — 3-crew capsule (Soyuz reference)
@PART[kv3Pod]:NEEDS[SquadExpansion/MakingHistory]:FINAL
{
	@manufacturer = Kerolev OKB
}

