AGENT
{
	name = Archer Areospace
	title = Archer Areospace
	
	description = A private aerospace company headquartered in the Kerbin Badlands Region. Unlike government space agencies, Archer Areospace operates as an independent contractor, providing launch services, spacecraft, and mission support to national and international clients. From sounding rockets to orbital stations, if it flies, we build it.
	
	logoURL = Archer Areospace/Flags/Archer Areospace
	logoScaledURL = Archer Areospace/Flags/Archer Areospace
	
	mentality = Pioneer
	mentality = Commercial
}

