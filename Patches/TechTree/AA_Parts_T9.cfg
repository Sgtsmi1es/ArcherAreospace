// T9 is advanced technology — Remote Guidance Systems and beyond.
// ============================================================================
// These run :AFTER[ArcherAerospace] so they override the parking assignment.
// ============================================================================

// ============================================================================
// AA_9_Probe_Remote_Guidance_Systems — Remote Guidance Systems
// ============================================================================
// The RC Remote Guidance Units — the most complete command units available.
// ============================================================================

// --- RC Series Probe Cores ---
// RC-001S Remote Guidance Unit (1.25m)
@PART[probeStackSmall]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_9_Probe_Remote_Guidance_Systems
}

// RC-L01 Remote Guidance Unit (2.5m)
@PART[probeStackLarge]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_9_Probe_Remote_Guidance_Systems
}

// RC-XL001 Remote Guidance Unit (3.75m) — ReStock+
@PART[restock-drone-core-375-1]:AFTER[ArcherAerospace]
{
	@TechRequired = AA_9_Probe_Remote_Guidance_Systems
}

